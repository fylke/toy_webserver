services:
  erlang-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: toy_webserver_dev
    working_dir: /workspace/toy_webserver
    volumes:
      - .:/workspace/toy_webserver
    environment:
      HTTP_SERVER_ROOT: /workspace/toy_webserver
      CLASS_SHARED_TOKEN: ${CLASS_SHARED_TOKEN:-}
    command: ["bash", "-lc", "sleep infinity"]
    ports:
      - "${HOST_TCP_PORT:-7777}:7777"
      - "${HOST_HTTP_PORT:-8080}:8080"

  edge-proxy:
    image: docker.io/library/caddy:2
    container_name: toy_webserver_edge
    depends_on:
      - erlang-dev
    ports:
      - "${HOST_PROXY_PORT:-8081}:8081"
    environment:
      CLASS_SHARED_TOKEN: ${CLASS_SHARED_TOKEN:-}
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-host.containers.internal:${HOST_HTTP_PORT:-8080}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
